<style>
body{--a:#ffb000;--ink:#f1ead4;--ln:color-mix(in srgb,var(--a) 30%,transparent);--lb:color-mix(in srgb,var(--a) 68%,#000);--er:#ff3b4a;--disp:'Rajdhani','Roboto Condensed','Arial Narrow',sans-serif;--mono:'Share Tech Mono','IBM Plex Mono',Consolas,monospace;color-scheme:dark}

body[data-p=amb] #c{filter:sepia(1) saturate(3.2) hue-rotate(-8deg) brightness(1.1)}
body[data-p=grn] #c{filter:sepia(1) saturate(3.2) hue-rotate(78deg) brightness(1.1)}
body[data-p=cyn] #c{filter:sepia(1) saturate(3.2) hue-rotate(138deg) brightness(1.1)}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:#000;color:var(--ink);font:13px/1.35 var(--mono);font-variant-numeric:tabular-nums;overflow:hidden}
button,input{font:inherit;letter-spacing:inherit;color:inherit;border:0;outline:0;background:none}button{cursor:pointer}
:focus-visible{outline:1px solid var(--a);outline-offset:2px}
#c{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
body.fit #c{object-fit:contain}
.ui,#s{transition:opacity .25s}
body.hide .ui,body.hide #s{opacity:0;pointer-events:none}
.ui{position:fixed;z-index:2}
#hd{inset:0;width:100%;height:100%;pointer-events:none}
#fx{inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.7) 100%),repeating-linear-gradient(0deg,rgba(0,0,0,.17) 0 1px,transparent 1px 3px)}
.hud{position:fixed;left:50%;top:50%;width:128px;height:128px;margin:-64px;color:var(--a);pointer-events:none}
.pnl{background:linear-gradient(var(--a),var(--a)) 0 0/16px 2px,linear-gradient(var(--a),var(--a)) 0 0/2px 16px,linear-gradient(var(--a),var(--a)) 100% 0/16px 2px,linear-gradient(var(--a),var(--a)) 100% 0/2px 16px,linear-gradient(var(--a),var(--a)) 0 100%/16px 2px,linear-gradient(var(--a),var(--a)) 0 100%/2px 16px,linear-gradient(var(--a),var(--a)) 100% 100%/16px 2px,linear-gradient(var(--a),var(--a)) 100% 100%/2px 16px,rgba(3,4,3,.62);background-repeat:no-repeat;box-shadow:inset 0 0 0 1px var(--ln);backdrop-filter:blur(3px)}
.pnl h2{position:absolute;left:14px;top:-9px;padding:0 12px 0 8px;background:var(--a);color:#000;font:700 11px/16px var(--disp);letter-spacing:.24em;text-transform:uppercase;clip-path:polygon(0 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.pb{padding:18px 14px 12px}
.brand{left:16px;top:10px;padding-left:10px;border-left:3px solid var(--a)}
.brand b{display:block;font:700 22px/1 var(--disp);letter-spacing:.32em}.brand span{font:600 10px var(--disp);letter-spacing:.24em;text-transform:uppercase;color:var(--lb)}
.tools{right:16px;top:12px;display:flex;align-items:center;gap:14px}

.lk::before{content:"";width:8px;height:8px;background:currentColor}
.lk.busy::before{animation:bl .8s steps(2) infinite}.lk.err{color:var(--er)}
@keyframes bl{50%{opacity:.1}}
#utc{font-size:12px;color:var(--lb);white-space:nowrap}
.chip{height:26px;padding:0 12px;font:700 11px var(--disp);letter-spacing:.22em;color:var(--a);background:color-mix(in srgb,var(--a) 12%,transparent);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%);white-space:nowrap}
.chip:hover,#pl:hover:not(:disabled),#pv:hover:not(:disabled),#nx:hover:not(:disabled){background:var(--a);color:#000}
.ic{width:26px;height:26px;display:grid;place-items:center;color:var(--a)}
#nav{left:16px;top:84px;width:250px;display:flex;flex-direction:column;gap:2px}
#nav button{height:30px;display:flex;align-items:center;gap:12px;padding:0 12px;text-align:left;font:600 13px var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--lb);background:color-mix(in srgb,var(--a) 8%,transparent);border-left:2px solid var(--ln);clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%);transition:background .15s}
#nav button span{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#nav button small{display:none}
#nav button:hover{background:color-mix(in srgb,var(--a) 18%,transparent)}
#nav button.on{background:var(--a);color:#000;border-left-color:var(--a)}#nav button.on span{color:#000}
#tg{left:16px;top:262px;width:250px}
#f{left:16px;top:440px;width:250px;display:flex;align-items:center;gap:10px;padding:9px 12px}
#f::before{content:"CMD>";font:700 12px var(--disp);letter-spacing:.2em;color:var(--a)}
#f input{flex:1;min-width:0;font-size:13px;caret-color:var(--a)}#f input::placeholder{color:var(--lb)}
#tt{font:700 22px/1.05 var(--disp);letter-spacing:.06em;text-transform:uppercase;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--ln)}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
dt{font:600 11px var(--disp);letter-spacing:.22em;text-transform:uppercase;color:var(--lb);align-self:center}dd{text-align:right;font-size:14px}
#ob{right:170px;bottom:118px;width:290px}
#wl{font:700 38px/1 var(--disp);letter-spacing:.04em;color:var(--a);text-shadow:0 0 14px color-mix(in srgb,var(--a) 55%,transparent);min-height:38px}
#wb{--p:0%;position:relative;height:10px;margin-top:10px;background:repeating-linear-gradient(90deg,var(--ln) 0 4px,transparent 4px 6px)}
#wb::after{content:"";position:absolute;inset:0;width:var(--p);background:repeating-linear-gradient(90deg,var(--a) 0 4px,transparent 4px 6px)}
.wr{display:flex;justify-content:space-between;margin:5px 0 14px;font:600 10px var(--disp);letter-spacing:.16em;color:var(--lb)}
.sc{margin-top:14px;padding-top:12px;border-top:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;gap:12px}
.sc>div{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
#cp{width:64px;height:64px}#cp #cn{stroke:var(--a)}#cp text{font:700 15px var(--disp);fill:var(--ink);stroke:none;text-anchor:middle;dominant-baseline:central}
#sbar{height:7px;border:1px solid var(--ink);border-top:0}#sl{font-size:12px}
.ctl{left:16px;right:16px;bottom:34px;display:flex;align-items:center;gap:12px;padding:12px 14px}
.ctl>button{height:28px;padding:0 14px;font:700 13px var(--disp);letter-spacing:.22em;text-transform:uppercase;color:var(--a);background:color-mix(in srgb,var(--a) 12%,transparent);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%);transition:background .15s}
.ctl>button:disabled{opacity:.3;cursor:default}
#pv,#nx{font-size:18px;line-height:1;padding:0 12px}#pl{min-width:84px}
#t0,#t1{font-size:12px;color:var(--lb)}
#tl{position:relative;flex:1;height:24px}
#tl::before{content:"";position:absolute;left:0;right:0;bottom:6px;height:1px;background:var(--ln)}
.tk{position:absolute;bottom:0;width:16px;height:24px;transform:translateX(-50%);display:flex;align-items:flex-end;justify-content:center}
.tk i{width:1px;height:var(--h);margin-bottom:6px;background:var(--lb)}
.tk:hover i{background:var(--ink);width:2px}.tk.on i{background:var(--a);width:2px}.tk.on::after{content:"";position:absolute;bottom:2px;width:9px;height:9px;background:var(--a);box-shadow:0 0 0 2px #000}
.keys{left:16px;right:16px;bottom:10px;display:flex;gap:22px;font:600 10px var(--disp);letter-spacing:.2em;text-transform:uppercase;color:var(--lb);white-space:nowrap;overflow:hidden}
kbd{font:inherit;border:1px solid var(--ln);padding:0 5px;margin-right:3px;color:var(--a)}
#s{position:fixed;left:50%;bottom:116px;transform:translateX(-50%);z-index:3;padding:5px 16px;border-left:3px solid var(--a);background:rgba(0,0,0,.65);font:600 12px var(--disp);letter-spacing:.22em;text-transform:uppercase;color:var(--a);text-align:center;max-width:90%}
#s.err{color:var(--er);border-left-color:var(--er)}
@media(max-width:1000px){
  .brand span,#utc,.keys{display:none}.brand b{font-size:14px;letter-spacing:.2em}.lk{font-size:0}.tools{gap:8px}
  #nav{top:48px;left:10px;right:10px;width:auto;flex-direction:row;overflow:auto;scrollbar-width:none}#nav button{flex:none;padding:0 12px}
  #tg,#ob{top:188px;width:calc(50% - 15px)}#tg{left:10px}#ob{right:10px;bottom:auto}#f{display:none}
  #tt{font-size:16px}#wl{font-size:26px;min-height:26px}.sc{flex-direction:column;align-items:flex-start}.sc>div{align-items:flex-start}
  .ctl{left:10px;right:10px;bottom:10px;gap:8px}#t0,#t1{display:none}#s{bottom:76px}
}
</style>
</head>
<body data-p="amb">
<canvas id="c" width="1" height="1"></canvas>
<div id="fx" class="ui"></div>
<canvas id="hd" class="ui"></canvas>
<svg class="hud" viewBox="-64 -64 128 128" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M-30-14V-30H-14M14-30H30V-14M30 14V30H14M-14 30H-30V14" stroke-width="2.2"/><path d="M0-62V-40M0 40V62M-62 0H-40M40 0H62" stroke-opacity=".7"/><path d="M-8 0h5M3 0h5M0-8v5M0 3v5"/><path d="M-52-3v6M-46-2v4M52-3v6M46-2v4M-3-52h6M-2-46h4M-3 52h6M-2 46h4" stroke-opacity=".6"/></svg>
<div id="s">Select a target</div>
<div class="ui brand"><b>MONSTELLAR</b><span>SPHEREx survey viewer // IRSA</span></div>
<div class="ui tools"><span id="lk" class="lk">IRSA NOMINAL</span><span id="utc"></span><button class="chip" id="pal" title="Display palette (C)">DISP AMB</button>
  <button class="ic" id="fs" title="Fullscreen (F) · Hide interface (H) · Fit image (Z) · Move (WASD) · Zoom (+/− or scroll)" aria-label="Fullscreen"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 6V1h5M10 1h5v5M15 10v5h-5M6 15H1v-5"/></svg></button></div>
<nav id="nav" class="ui"></nav>
<aside id="tg" class="ui pnl"><h2>Target lock</h2><div class="pb"><div id="tt"></div>
  <dl><dt>RA</dt><dd id="ra"></dd><dt>Dec</dt><dd id="de"></dd><dt>FOV</dt><dd id="fv"></dd></dl></div></aside>
<form id="f" class="ui pnl"><input id="q" placeholder="RA, DEC (DEG)" autocomplete="off" aria-label="RA, Dec in degrees"></form>
<aside id="ob" class="ui pnl"><h2>Spectral</h2><div class="pb"><div id="wl"></div><div id="wb"></div><div class="wr"><span>0.75</span><span>5.00 µm</span></div>
  <dl><dt>Date</dt><dd id="dt"></dd><dt>Frame</dt><dd id="fr"></dd></dl>
  <div class="sc"><svg id="cp" width="88" height="88" viewBox="-44 -44 88 88" fill="none" stroke="#fff" stroke-width="1.3"><line id="cn" x1="0" y1="0" x2="0" y2="-28"/><line id="ce" x1="0" y1="0" x2="-28" y2="0" stroke-opacity=".55"/><text id="tn" x="0" y="-38">N</text><text id="te" x="-38" y="0">E</text></svg><div><div id="sbar"></div><span id="sl"></span></div></div></div></aside>
<footer class="ui pnl ctl">
  <button id="pv" disabled aria-label="Previous frame">‹</button><button id="pl" disabled>Play</button><button id="nx" disabled aria-label="Next frame">›</button>
  <span id="t0"></span><div id="tl"></div><span id="t1"></span>
</footer>
<div class="ui keys"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>Move</span><span><kbd>+</kbd><kbd>−</kbd>Zoom</span><span><kbd>Space</kbd>Play</span><span><kbd>←</kbd><kbd>→</kbd>Frame</span><span><kbd>C</kbd>Display</span><span><kbd>Z</kbd>Fit</span><span><kbd>H</kbd>Hide</span><span><kbd>F</kbd>Full</span></div>
<script>
// GitHub Pages caches HTML ~10 min: re-fetch self uncached; if the ETag changed, reload onto the fresh copy
fetch(location.href,{cache:"reload"}).then(r=>{const e=r.headers.get("etag"),o=localStorage.e;if(e){localStorage.e=e;o&&o!=e&&location.reload()}}).catch(()=>{});
// IRSA sends no CORS headers, so browsers go through a proxy: worker.js on Cloudflare Workers.
const PROXY="https://monstellar.gundegmaamunxjargal.workers.dev";
const T=[["Barnard's Star",269.452,4.693],["Epsilon Indi B",331.077,-56.783],["WISE 0855",133.795,-7.245],["RW Aurigae",76.956,30.401],["R Draconis",248.125,66.764]];
const $=i=>document.getElementById(i),cv=$("c"),ctx=cv.getContext("2d"),p2=n=>String(n).padStart(2,"0"),
P=u=>PROXY?`${PROXY}?u=${encodeURIComponent(u)}`:u,
st=(t,e)=>{$("s").hidden=!t;$("s").textContent=t||"";$("s").className=e?"err":"";$("lk").className=e?"lk err":t?"lk busy":"lk";$("lk").textContent="IRSA "+(e?"FAULT":t?"ACQUIRING":"NOMINAL")},
hms=d=>{const h=(((d%360)+360)%360)/15,m=h%1*60;return`${p2(h|0)}h ${p2(m|0)}m ${(m%1*60).toFixed(1).padStart(4,"0")}s`},
dms=d=>{const a=Math.abs(d),m=a%1*60;return`${d<0?"−":"+"}${p2(a|0)}° ${p2(m|0)}′ ${p2(Math.round(m%1*60))}″`},
tel=(i,v,s)=>{$(i).firstChild.nodeValue=v;if(s!=null&&$(i).lastChild.tagName)$(i).lastChild.textContent=s};
let F=[],k=0,tm,ac,V,L,W,dirty,bz,fl;
const co=()=>{$("ra").textContent=hms(V.ra);$("de").textContent=dms(V.dec);$("fv").textContent=`${V.z.toFixed(3)}° (${(V.z*60).toFixed(1)}′)`};

// minimal FITS reader: walks the HDUs and returns the first 2D image (SPHEREx cutout: IMAGE ext)
function fits(buf){
  const dv=new DataView(buf),td=new TextDecoder();let o=0;
  while(o<buf.byteLength){
    const h={};
    for(let end=0;!end;o+=2880)for(let i=0;i<36;i++){
      const c=td.decode(new Uint8Array(buf,o+i*80,80));
      if(c.startsWith("END")){end=1;break}
      if(c[8]=="=")h[c.slice(0,8).trim()]=c.slice(10).split("/")[0].trim();
    }
    const n=+h.NAXIS||0,bp=+h.BITPIX,by=Math.abs(bp)/8;let N=n?1:0;
    for(let j=1;j<=n;j++)N*=+h["NAXIS"+j];
    if(n==2){
      const g={"-32":i=>dv.getFloat32(o+4*i),"-64":i=>dv.getFloat64(o+8*i),16:i=>dv.getInt16(o+2*i),32:i=>dv.getInt32(o+4*i)}[bp],a=new Float32Array(N);
      for(let i=0;i<N;i++)a[i]=g(i);
      const G=q=>+h[q]||0,e1=h.CDELT1==null?1:G("CDELT1"),e2=h.CDELT2==null?1:G("CDELT2"),m=h.CD1_1!=null?[G("CD1_1"),G("CD1_2"),G("CD2_1"),G("CD2_2")]:[e1*(h.PC1_1==null?1:G("PC1_1")),e1*G("PC1_2"),e2*G("PC2_1"),e2*(h.PC2_2==null?1:G("PC2_2"))];
      return{w:+h.NAXIS1,h:+h.NAXIS2,a,m};
    }
    o+=Math.ceil(by*(+h.GCOUNT||1)*(N+(+h.PCOUNT||0))/2880)*2880;
  }
  throw Error("no image in FITS");
}

// asinh stretch (2%..99.5%) + brand colour ramp -> offscreen canvas (FITS rows run bottom-up, so flip y)
const S=[[0,0,0],[72,72,72],[176,176,176],[255,255,255]],ramp=t=>{const q=Math.min(2,t*3|0),f=t*3-q;return S[q].map((c,j)=>c+(S[q+1][j]-c)*f)};
function paint({w,h,a}){
  const v=[...a].filter(Number.isFinite).sort((x,y)=>x-y),lo=v[v.length*.02|0]??0,hi=v[v.length*.995|0]??1,
  c=document.createElement("canvas");c.width=w;c.height=h;
  const g=c.getContext("2d"),d=g.createImageData(w,h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const p=a[(h-1-y)*w+x],t=Number.isFinite(p)?Math.asinh(10*Math.min(1,Math.max(0,(p-lo)/(hi-lo||1))))/Math.asinh(10):0;
    d.data.set([...ramp(t),255],(y*w+x)*4);
  }
  g.putImageData(d,0,0);return c;
}

function show(n){
  if(!F.length)return;
  k=(n+F.length)%F.length;const f=F[k];L={...W,m:f.m};
  cv.width=f.c.width;cv.height=f.c.height;ctx.drawImage(f.c,0,0);
  $("wl").textContent=f.w?`${f.w} µm`:"—";$("wb").style.setProperty("--p",(+f.w?Math.min(100,Math.max(0,(f.w-.75)/.0425)):0)+"%");$("dt").textContent=f.d;$("fr").textContent=`${p2(k+1)} / ${p2(F.length)}`;sc();
  [...$("tl").children].forEach((b,j)=>b.classList.toggle("on",j==k));
}
const stop=()=>{fl=0;clearInterval(tm);tm=0;$("pl").textContent="Play"};
const play=()=>{if(F.length<2)return;fl=0;$("pl").textContent="Pause";tm=setInterval(()=>show(k+1),700)};
const toggle=()=>tm?stop():play();

async function load(n,ra,dec,z=.25,keep){
  stop();fl=1;ac?.abort();ac=new AbortController;const sg=ac.signal;bz=1;
  F=[];keep||(cv.width=cv.height=1,ctx.clearRect(0,0,1,1),L=0,cv.style.transform="");$("tl").innerHTML="";
  ["pv","pl","nx"].forEach(i=>$(i).disabled=true);
  V={n,ra,dec,z};$("tt").textContent=n;co();["wl","dt","fr","t0","t1"].forEach(i=>$(i).textContent="");$("wb").style.setProperty("--p","0%");
  [...$("nav").children].forEach(b=>b.classList.toggle("on",b.dataset.n==n));
  st("Finding SPHEREx scans…");
  try{
    const x=new DOMParser().parseFromString(await(await fetch(P(`https://irsa.ipac.caltech.edu/SIA?COLLECTION=spherex_qr3&POS=circle+${ra}+${dec}+0.02&MAXREC=300`),{signal:sg})).text(),"text/xml"),
    f=[...x.getElementsByTagName("FIELD")].map(e=>e.getAttribute("name")),u=f.indexOf("access_url"),t=f.indexOf("t_min"),w=f.indexOf("em_min"),
    R=[...x.getElementsByTagName("TR")].map(r=>[...r.getElementsByTagName("TD")].map(d=>d.textContent.trim())).filter(r=>(r[u]||"").includes("/ibe/")).sort((a,b)=>a[t]-b[t]);
    if(!R.length)return st(`No SPHEREx scans cover this target yet`,1);
    const S=Array.from({length:Math.min(12,R.length)},(_,i)=>R[Math.round(i*(R.length-1)/Math.max(Math.min(12,R.length)-1,1))]),iso=m=>m?new Date((m-40587)*864e5).toISOString().slice(0,10):"—",t0=+S[0][t],t1=+S[S.length-1][t];
    W={ra,dec,z};$("t0").textContent=iso(t0);$("t1").textContent=iso(t1);
    for(let j=0;j<S.length;j++){
      const r=S[j];st(`Loading image ${j+1} of ${S.length}…`);
      try{
        const b=await(await fetch(P(`${r[u]}${r[u].includes("?")?"&":"?"}center=${ra},${dec}&size=${z}`),{signal:sg})).arrayBuffer();if(sg.aborted)return;
        const q=fits(b),m=+r[t],f={c:paint(q),m:q.m,t:m,d:iso(m),w:+r[w]?(r[w]*1e6).toFixed(2):""};
        $("tl").insertAdjacentHTML("beforeend",`<button class="tk" data-j="${F.push(f)-1}" title="${f.d} · ${f.w} µm" style="left:calc(8px + (100% - 16px)*${t1>t0?(m-t0)/(t1-t0):j/Math.max(S.length-1,1)});--h:${6+(Math.min(5,Math.max(.75,+f.w||1))-.75)/4.25*14}px"><i></i></button>`);
        ["pv","pl","nx"].forEach(i=>$(i).disabled=F.length<2);show(fl?F.length-1:k);
      }catch(e){if(e.name=="AbortError")throw e}
    }
    if(!F.length)return st("No usable images came back from IRSA",1);
    st("");dirty=(V.ra!=ra||V.dec!=dec||V.z!=z)&&performance.now();
  }catch(e){
    if(e.name=="AbortError")return;
    console.error(e);
    st(PROXY?"Couldn’t reach NASA IRSA through the proxy":"Browser blocked NASA IRSA (no CORS). Set PROXY in index.html",1);
  }finally{if(sg==ac.signal)bz=0}
}

T.forEach(([n,ra,dec],i)=>{const b=document.createElement("button");b.dataset.n=n;b.title=`RA ${ra}° Dec ${dec}°`;b.innerHTML=`${p2(i+1)}<span>${n}</span><small>${ra}° ${dec>0?"+":""}${dec}°</small>`;b.onclick=()=>load(n,ra,dec);$("nav").append(b)});

$("f").onsubmit=e=>{
