<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000">
<title>Monstellar · SPHEREx Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&family=IBM+Plex+Sans:wght@300;400;500&display=swap">
<style>
:root{--a:#ffb347;--ink:#f4f4f4;--dim:rgba(244,244,244,.74);--sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;--mono:'IBM Plex Mono',ui-monospace,'SF Mono',Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:#000;color:var(--ink);font:14px/1.4 var(--sans);font-variant-numeric:tabular-nums;overflow:hidden;text-shadow:0 1px 3px #000,0 0 14px rgba(0,0,0,.75)}
button,input{font:inherit;color:inherit;border:0;outline:0;background:none;text-shadow:inherit}button{cursor:pointer}
:focus-visible{outline:1px solid var(--a);outline-offset:3px}
canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
body.fit canvas{object-fit:contain}
.hud{position:fixed;left:50%;top:50%;width:44px;height:44px;margin:-22px;color:var(--a);opacity:.85;pointer-events:none}
.ui,#s{transition:opacity .25s}
body.hide .ui,body.hide #s{opacity:0;pointer-events:none}
.ui{position:fixed;z-index:2}
.top{inset:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:20px 28px}
#nav{display:flex;gap:26px;overflow:auto;scrollbar-width:none}
#nav button{font-size:0;padding:4px 0;border-bottom:2px solid transparent;color:var(--dim);white-space:nowrap;transition:color .15s}
#nav button span{font-size:14px}#nav button small{display:none}
#nav button:hover{color:#fff}#nav button.on{color:#fff;border-bottom-color:var(--a)}
.tools{display:flex;align-items:center;gap:18px}
form input{width:160px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.35);font:13px var(--mono)}
form input::placeholder{color:var(--dim)}form input:focus{border-color:var(--a)}
.ic{width:28px;height:28px;display:grid;place-items:center;color:var(--dim)}.ic:hover{color:#fff}
.info{left:28px;right:28px;bottom:78px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
#tt{font-size:clamp(28px,4.4vw,56px);font-weight:300;line-height:1.05;letter-spacing:-.015em}
#co{margin-top:10px;font:13px var(--mono);color:var(--dim)}
.rd{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
#wl{font:300 clamp(22px,2.6vw,34px)/1 var(--mono);color:var(--a)}
#rd{margin-top:8px;font:13px var(--mono);color:var(--dim)}
.sc{margin-top:18px;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
#cp{filter:drop-shadow(0 0 2px #000)}#cp text{font:11px var(--mono);fill:#fff;stroke:#000;stroke-width:3px;paint-order:stroke;text-anchor:middle;dominant-baseline:central;text-shadow:none}
#sbar{height:7px;border:1px solid #fff;border-top:0;width:90px;filter:drop-shadow(0 0 2px #000)}#sl{font:12px var(--mono);color:#fff}
.ctl{left:28px;right:28px;bottom:24px;display:flex;align-items:center;gap:20px}
.ctl>button{color:var(--dim);transition:color .15s}.ctl>button:hover:not(:disabled){color:#fff}.ctl>button:disabled{opacity:.35;cursor:default}
#pl{min-width:44px;font-weight:500;color:#fff}#pv,#nx{font-size:20px;line-height:1}
#t0,#t1{font:11px var(--mono);color:var(--dim)}
#tl{position:relative;flex:1;height:24px}
#tl::before{content:"";position:absolute;left:0;right:0;bottom:6px;height:1px;background:rgba(255,255,255,.4)}
.tk{position:absolute;bottom:0;width:16px;height:24px;transform:translateX(-50%);display:flex;align-items:flex-end;justify-content:center}
.tk i{width:1px;height:var(--h);margin-bottom:6px;background:rgba(255,255,255,.8);filter:drop-shadow(0 0 2px #000)}
.tk:hover i{background:#fff;width:2px}.tk.on i{background:var(--a);width:2px}.tk.on::after{content:"";position:absolute;bottom:2px;width:9px;height:9px;border-radius:50%;background:var(--a);box-shadow:0 0 0 2px #000}
#s{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);z-index:3;font:13px var(--mono);color:var(--dim);text-align:center;max-width:90%}
#s.err{color:#ff8a7a}
@media(max-width:900px){
  .top{padding:12px 14px}form{display:none}
  .info{left:14px;right:14px;bottom:72px;flex-direction:column;align-items:flex-start;gap:14px}.rd,.sc{align-items:flex-start;text-align:left}.sc{flex-direction:row;align-items:center;gap:14px;margin-top:10px}
  .ctl{left:14px;right:14px;gap:12px}#t0,#t1{display:none}#s{bottom:210px}
}
</style>
</head>
<body>
<canvas id="c" width="1" height="1"></canvas>
<svg class="hud" viewBox="-22 -22 44 44" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M0-20V-8M0 8V20M-20 0H-8M8 0H20"/></svg>
<div id="s">Select a target</div>
<header class="ui top">
  <nav id="nav"></nav>
  <div class="tools"><form id="f"><input id="q" placeholder="RA, Dec in degrees" autocomplete="off" aria-label="RA, Dec in degrees"></form>
  <button class="ic" id="fs" title="Fullscreen (F) · Hide interface (H) · Fit image (Z)" aria-label="Fullscreen"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 6V1h5M10 1h5v5M15 10v5h-5M6 15H1v-5"/></svg></button></div>
</header>
<section class="ui info">
  <div><h1 id="tt"></h1><div id="co"></div></div>
  <div class="rd"><div id="wl"></div><div id="rd"></div>
    <div class="sc"><svg id="cp" width="88" height="88" viewBox="-44 -44 88 88" fill="none" stroke="#fff" stroke-width="1.3"><line id="cn" x1="0" y1="0" x2="0" y2="-28"/><line id="ce" x1="0" y1="0" x2="-28" y2="0" stroke-opacity=".55"/><text id="tn" x="0" y="-38">N</text><text id="te" x="-38" y="0">E</text></svg>
    <div><div id="sbar"></div><span id="sl"></span></div></div></div>
</section>
<footer class="ui ctl">
  <button id="pv" disabled aria-label="Previous frame">‹</button><button id="pl" disabled>Play</button><button id="nx" disabled aria-label="Next frame">›</button>
  <span id="t0"></span><div id="tl"></div><span id="t1"></span>
</footer>
<script>
// IRSA sends no CORS headers, so browsers go through a proxy: worker.js on Cloudflare Workers.
const PROXY="https://monstellar.gundegmaamunxjargal.workers.dev";
const T=[["Barnard's Star",269.452,4.693],["Epsilon Indi B",331.077,-56.783],["WISE 0855",133.795,-7.245],["RW Aurigae",76.956,30.401],["R Draconis",248.125,66.764]];
const $=i=>document.getElementById(i),cv=$("c"),ctx=cv.getContext("2d"),p2=n=>String(n).padStart(2,"0"),
P=u=>PROXY?`${PROXY}?u=${encodeURIComponent(u)}`:u,
st=(t,e)=>{$("s").hidden=!t;$("s").textContent=t||"";$("s").className=e?"err":""},
hms=d=>{const h=(((d%360)+360)%360)/15,m=h%1*60;return`${p2(h|0)}h ${p2(m|0)}m ${(m%1*60).toFixed(1).padStart(4,"0")}s`},
dms=d=>{const a=Math.abs(d),m=a%1*60;return`${d<0?"−":"+"}${p2(a|0)}° ${p2(m|0)}′ ${p2(Math.round(m%1*60))}″`},
tel=(i,v,s)=>{$(i).firstChild.nodeValue=v;if(s!=null&&$(i).lastChild.tagName)$(i).lastChild.textContent=s};
let F=[],k=0,tm,ac;

// minimal FITS reader: walks the HDUs and returns the first 2D image (SPHEREx cutout: IMAGE ext)
function fits(buf){
  const dv=new DataView(buf),td=new TextDecoder();let o=0;
  while(o<buf.byteLength){
    const h={};
    for(let end=0;!end;o+=2880)for(let i=0;i<36;i++){
      const c=td.decode(new Uint8Array(buf,o+i*80,80));
      if(c.startsWith("END")){end=1;break}
      if(c[8]=="=")h[c.slice(0,8).trim()]=c.slice(10).split("/")[0].trim();
    }
    const n=+h.NAXIS||0,bp=+h.BITPIX,by=Math.abs(bp)/8;let N=n?1:0;
    for(let j=1;j<=n;j++)N*=+h["NAXIS"+j];
    if(n==2){
      const g={"-32":i=>dv.getFloat32(o+4*i),"-64":i=>dv.getFloat64(o+8*i),16:i=>dv.getInt16(o+2*i),32:i=>dv.getInt32(o+4*i)}[bp],a=new Float32Array(N);
      for(let i=0;i<N;i++)a[i]=g(i);
      const G=q=>+h[q]||0,e1=h.CDELT1==null?1:G("CDELT1"),e2=h.CDELT2==null?1:G("CDELT2"),m=h.CD1_1!=null?[G("CD1_1"),G("CD1_2"),G("CD2_1"),G("CD2_2")]:[e1*(h.PC1_1==null?1:G("PC1_1")),e1*G("PC1_2"),e2*G("PC2_1"),e2*(h.PC2_2==null?1:G("PC2_2"))];
      return{w:+h.NAXIS1,h:+h.NAXIS2,a,m};
    }
    o+=Math.ceil(by*(+h.GCOUNT||1)*(N+(+h.PCOUNT||0))/2880)*2880;
  }
  throw Error("no image in FITS");
}

// asinh stretch (2%..99.5%) + brand colour ramp -> offscreen canvas (FITS rows run bottom-up, so flip y)
const S=[[0,0,0],[72,72,72],[176,176,176],[255,255,255]],ramp=t=>{const q=Math.min(2,t*3|0),f=t*3-q;return S[q].map((c,j)=>c+(S[q+1][j]-c)*f)};
function paint({w,h,a}){
  const v=[...a].filter(Number.isFinite).sort((x,y)=>x-y),lo=v[v.length*.02|0]??0,hi=v[v.length*.995|0]??1,
  c=document.createElement("canvas");c.width=w;c.height=h;
  const g=c.getContext("2d"),d=g.createImageData(w,h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const p=a[(h-1-y)*w+x],t=Number.isFinite(p)?Math.asinh(10*Math.min(1,Math.max(0,(p-lo)/(hi-lo||1))))/Math.asinh(10):0;
    d.data.set([...ramp(t),255],(y*w+x)*4);
  }
  g.putImageData(d,0,0);return c;
}

function show(n){
  if(!F.length)return;
  k=(n+F.length)%F.length;const f=F[k];
  cv.width=f.c.width;cv.height=f.c.height;ctx.drawImage(f.c,0,0);
  $("wl").textContent=f.w?`${f.w} µm`:"";$("rd").textContent=`${f.d} · frame ${k+1} of ${F.length}`;sc();
  [...$("tl").children].forEach((b,j)=>b.classList.toggle("on",j==k));
}
const stop=()=>{clearInterval(tm);tm=0;$("pl").textContent="Play"};
const play=()=>{if(F.length<2)return;$("pl").textContent="Pause";tm=setInterval(()=>show(k+1),700)};
const toggle=()=>tm?stop():play();

async function load(n,ra,dec){
  stop();ac?.abort();ac=new AbortController;const sg=ac.signal;
  F=[];cv.width=cv.height=1;ctx.clearRect(0,0,1,1);$("tl").innerHTML="";
  ["pv","pl","nx"].forEach(i=>$(i).disabled=true);
  $("tt").textContent=n;$("co").textContent=`RA ${hms(ra)}   Dec ${dms(dec)}`;$("wl").textContent=$("rd").textContent=$("t0").textContent=$("t1").textContent="";
  [...$("nav").children].forEach(b=>b.classList.toggle("on",b.dataset.n==n));
  st("Finding SPHEREx scans…");
  try{
    const x=new DOMParser().parseFromString(await(await fetch(P(`https://irsa.ipac.caltech.edu/SIA?COLLECTION=spherex_qr3&POS=circle+${ra}+${dec}+0.02&MAXREC=300`),{signal:sg})).text(),"text/xml"),
    f=[...x.getElementsByTagName("FIELD")].map(e=>e.getAttribute("name")),u=f.indexOf("access_url"),t=f.indexOf("t_min"),w=f.indexOf("em_min"),
    R=[...x.getElementsByTagName("TR")].map(r=>[...r.getElementsByTagName("TD")].map(d=>d.textContent.trim())).filter(r=>(r[u]||"").includes("/ibe/")).sort((a,b)=>a[t]-b[t]);
    if(!R.length)return st(`No SPHEREx scans cover this target yet`,1);
    const S=Array.from({length:Math.min(12,R.length)},(_,i)=>R[Math.round(i*(R.length-1)/Math.max(Math.min(12,R.length)-1,1))]);let done=0;
    await Promise.all(S.map(async(r,j)=>{
      try{
        const b=await(await fetch(P(`${r[u]}${r[u].includes("?")?"&":"?"}center=${ra},${dec}&size=0.25`),{signal:sg})).arrayBuffer(),
        m=+r[t];
        F[j]={...(i=>({c:paint(i),m:i.m}))(fits(b)),t:m,d:m?new Date((m-40587)*864e5).toISOString().slice(0,10):"—",w:+r[w]?(r[w]*1e6).toFixed(2):""};
      }catch(e){if(e.name=="AbortError")throw e}
      st(`Loading images ${++done} of ${S.length}…`);
    }));
    F=F.filter(Boolean);
    if(!F.length)return st("No usable images came back from IRSA",1);
    st("");
    const t0=F[0].t,t1=F[F.length-1].t;$("tl").innerHTML=F.map((f,j)=>`<button class="tk" data-j="${j}" title="${f.d} · ${f.w} µm" style="left:calc(8px + (100% - 16px)*${t1>t0?(f.t-t0)/(t1-t0):j/Math.max(F.length-1,1)});--h:${6+(Math.min(5,Math.max(.75,+f.w||1))-.75)/4.25*14}px"><i></i></button>`).join("");$("t0").textContent=F[0].d;$("t1").textContent=F[F.length-1].d;
    ["pv","pl","nx"].forEach(i=>$(i).disabled=F.length<2);
    show(0);
  }catch(e){
    if(e.name=="AbortError")return;
    console.error(e);
    st(PROXY?"Couldn’t reach NASA IRSA through the proxy":"Browser blocked NASA IRSA (no CORS). Set PROXY in index.html",1);
  }
}

T.forEach(([n,ra,dec],i)=>{const b=document.createElement("button");b.dataset.n=n;b.innerHTML=`${p2(i+1)}<span>${n}</span><small>${ra}° ${dec>0?"+":""}${dec}°</small>`;b.onclick=()=>load(n,ra,dec);$("nav").append(b)});

$("f").onsubmit=e=>{
  e.preventDefault();
  const [ra,dec]=$("q").value.split(/[,\s]+/).filter(Boolean).map(Number);
  if(!Number.isFinite(ra)||!Number.isFinite(dec)||Math.abs(dec)>90)return st("ENTER COORDINATES AS: RA, DEC IN DEGREES (E.G. 269.452, 4.693)",1);
  load("Custom",ra,dec);
};
$("pl").onclick=toggle;$("pv").onclick=()=>{stop();show(k-1)};$("nx").onclick=()=>{stop();show(k+1)};
$("tl").onclick=e=>{const b=e.target.closest(".tk");if(b){stop();show(+b.dataset.j)}};
addEventListener("keydown",e=>{if(e.target.tagName=="INPUT")return;if(e.key=="ArrowLeft")$("pv").click();else if(e.key=="ArrowRight")$("nx").click();else if(e.key==" "){e.preventDefault();$("pl").disabled||toggle()}});

load(...T[0]);
function sc(){const f=F[k];if(!f||!f.m)return;const[a,b,c,d]=f.m,D=a*d-b*c;if(!D)return;
  const s=Math[document.body.classList.contains("fit")?"min":"max"](innerWidth/cv.width,innerHeight/cv.height),pp=s/(Math.sqrt(Math.abs(D))*3600),v=[10,30,60,120,300,600,1200].find(x=>x*pp>=90)||1200;
  $("sbar").style.width=v*pp+"px";$("sl").textContent=v<60?`${v}″`:`${v/60}′`;
  const u=([x,y])=>{const l=Math.hypot(x,y)||1;return[x/l,-y/l]};
  [["n",u([-b/D,a/D])],["e",u([d/D,-c/D])]].forEach(([i,p])=>{$("c"+i).setAttribute("x2",p[0]*28);$("c"+i).setAttribute("y2",p[1]*28);$("t"+i).setAttribute("x",p[0]*38);$("t"+i).setAttribute("y",p[1]*38)})}
const FS=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
$("fs").onclick=FS;$("c").onclick=()=>document.body.classList.toggle("hide");addEventListener("resize",sc);
addEventListener("keydown",e=>{if(e.target.tagName=="INPUT"||e.metaKey||e.ctrlKey)return;const q=e.key.toLowerCase();if(q=="h")$("c").click();else if(q=="f")FS();else if(q=="z"){document.body.classList.toggle("fit");sc()}});
load(...T[0]);
</script>
</body>
</html>
